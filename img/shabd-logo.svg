    .sb-eye-0 { transform-origin: 60.24px 105.76px; }
    .sb-eye-1 { transform-origin: 107.76px 105.76px; }
    .sb-eye { animation: sb-blink 4.6s linear infinite; }
    @keyframes sb-blink { 0%, 92%, 98%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    .sb-tail { transform-origin: 84px 191.56px; animation: sb-sway 5s ease-in-out infinite; }
    @keyframes sb-sway { 0%, 50%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
    .sb-wing-0 { transform-origin: 48.36px 149.32px; animation: sb-wing-0 10s ease-in-out infinite; }
    @keyframes sb-wing-0 { 0%, 70%, 88%, 100% { transform: rotate(0deg); } 73%, 79%, 85% { transform: rotate(30deg); } 76%, 82% { transform: rotate(7.5deg); } }
    .sb-wing-1 { transform-origin: 119.64px 149.32px; animation: sb-wing-1 10s ease-in-out infinite; }
    @keyframes sb-wing-1 { 0%, 70%, 88%, 100% { transform: rotate(0deg); } 73%, 79%, 85% { transform: rotate(-30deg); } 76%, 82% { transform: rotate(-7.5deg); } }
    .sb-beak-lower { animation: sb-beak 10s linear infinite; }
    @keyframes sb-beak { 0%, 70%, 88%, 100% { transform: translateY(0px); } 73%, 79%, 85% { transform: translateY(3.3px); } 76%, 82% { transform: translateY(0.79px); } }
    .sb-say-0 { animation: sb-say-0 10s ease-out 0s infinite; }
    @keyframes sb-say-0 { 0%, 71%, 90%, 100% { opacity: 0; transform: translate(-5.2px, 0.92px); } 76% { opacity: 1; } 84% { opacity: 1; } 89% { opacity: 0; transform: translate(10.4px, -1.83px); } }
    .sb-say-1 { animation: sb-say-1 10s ease-out 0.22s infinite; }
