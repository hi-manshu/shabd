    @keyframes sb-say-2 { 0%, 71%, 90%, 100% { opacity: 0; transform: translate(-3.67px, 3.8px); } 76% { opacity: 1; } 84% { opacity: 1; } 89% { opacity: 0; transform: translate(7.34px, -7.6px); } }
    @media (prefers-reduced-motion: reduce) { .sb-hop, .sb-head, .sb-tuft, .sb-eye, .sb-tail, .sb-wing, .sb-beak-lower, .sb-say { animation: none; } }
