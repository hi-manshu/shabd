# A small site that uses every feature once. The browser tests run against copies of it.
site:
  title: Fixture
  description: A site for Shabd's browser tests.
  url: https://fixture.test
  favicon: /favicon.svg
  repo: https://github.com/example/fixture
  nav:
    - { label: Guide, link: /guide/intro }
    - { label: API, link: /api/ping }

theme:
  # Readers may switch to any preset; the site's own palette is the default one with one colour changed.
  # Every preset is on offer so that the tests can put each theme on a real page.
  picker: true
  colors:
    highlight: { light: "#f6b40e", dark: "#ffc53d" }

layouts:
  wide-doc:
    extends: doc
    width: wide
    regions:
      aside: []

features:
  search: { semantic: false }
  studio: { sync: peers }

components:
  Counter: ./components/Counter.tsx
