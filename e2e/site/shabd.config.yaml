# A small site that uses every feature once. The browser tests run against copies of it.
site:
  title: Fixture
  description: A site for Shabd's browser tests.
  url: https://fixture.test
  favicon: /favicon.svg
  repo: https://github.com/example/fixture
  nav:
    - { label: Guide, link: /guide/intro }
    - { label: API, link: /api/ping }
  head:
    - { tag: meta, attrs: { name: fixture-head, content: written by site.head } }

theme:
  # Readers may switch to any preset; the site's own palette is the default one with one colour changed.
  # Every preset is on offer so that the tests can put each theme on a real page.
  picker: true
  colors:
    highlight: { light: "#f6b40e", dark: "#ffc53d" }

layouts:
  # A block with a condition: every layout has the banner, and it is shown under /extras alone.
  base:
    regions:
      banner:
        - block: notice
          when: { path: /extras/** }
  wide-doc:
    extends: doc
    width: wide
    regions:
      aside: []
  # A banner above the header, which holds the header down until the page is scrolled.
  announced:
    extends: doc
    regions:
      banner: [notice]

features:
  search: { semantic: false }
  studio: { sync: peers }
  feed: true

markdown:
  mermaid: true

redirects:
  /guide/start: /guide/intro
  /old-setup: /guide/setup#second-step

components:
  Counter: ./components/Counter.tsx

blocks:
  notice: ./components/Notice.tsx
