name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Shabd is developed on macOS, so Linux is the platform worth checking here.
    # Add macos-latest and windows-latest as a matrix once this passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Keyword search only: the build then needs no model download.
      - run: node packages/shabd/bin/shabd.js check docs
      - run: node packages/shabd/bin/shabd.js build docs --no-semantic

  # The browser tests, in Chromium, Firefox and WebKit as Playwright builds them for Linux.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      # The same suite again with the search index held in SQLite.
      - run: npx playwright test
        env:
          SHABD_E2E_STORE: sqlite
      # What a failed test saw: a trace of the page for each one. The folder's name starts with a dot,
      # which the action leaves out unless told otherwise.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/.results
          include-hidden-files: true

