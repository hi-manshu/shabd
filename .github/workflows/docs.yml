# Publishes docs/ to GitHub Pages, at https://hi-manshu.github.io/shabd/.
#
# It runs when main changes, and can be started by hand. What it needs:
#   1. Repository settings → Pages → Source: GitHub Actions
#   2. In docs/shabd.config.yaml, `site.url` is the Pages origin and
#      `site.base` is "/<repository name>/"
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history: each page shows the day of its last commit, which a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The embedding model (about 22 MB) and the embeddings of unchanged pages.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/@huggingface/transformers/.cache
            docs/.shabd
            docs/node_modules/.shabd
          key: shabd-search-${{ hashFiles('docs/shabd.config.yaml') }}
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
