  <style>
    .sb-hop { transform-origin: 84px 136px; animation: sb-hop 0.8s ease-out 0.4s 1; }
    @keyframes sb-hop { 0%, 100% { transform: translateY(0px) scale(1, 1); } 30% { transform: translateY(-11px) scale(1, 1); } 56% { transform: translateY(0px) scale(1.05, 0.93); } 76% { transform: translateY(0px) scale(0.99, 1.02); } }
    .sb-head { transform-origin: 84px 102px; animation: sb-head 10s ease-in-out infinite; }
    @keyframes sb-head { 0%, 30%, 62%, 70%, 76%, 82%, 88%, 100% { transform: rotate(0deg) translateY(0px); } 37%, 56% { transform: rotate(-9deg) translateY(0px); } 73%, 79%, 85% { transform: rotate(0deg) translateY(-2px); } }
    .sb-tuft-0 { transform-origin: 76px 41px; animation: sb-tuft-0 10s ease-in-out infinite; }
    @keyframes sb-tuft-0 { 0%, 30%, 62%, 100% { transform: rotate(0deg); } 38%, 54% { transform: rotate(-15deg); } }
    .sb-tuft-1 { transform-origin: 92px 41px; animation: sb-tuft-1 10s ease-in-out infinite; }
    @keyframes sb-tuft-1 { 0%, 30%, 62%, 100% { transform: rotate(0deg); } 38%, 54% { transform: rotate(15deg); } }
    .sb-tuft-2 { transform-origin: 84px 40px; animation: sb-tuft-2 10s ease-in-out infinite; }
    @keyframes sb-tuft-2 { 0%, 30%, 62%, 100% { transform: rotate(0deg); } 38%, 54% { transform: rotate(0deg); } }
    .sb-eye-0 { transform-origin: 66px 79px; }
    .sb-eye-1 { transform-origin: 102px 79px; }
    .sb-eye { animation: sb-blink 4.6s linear infinite; }
    @keyframes sb-blink { 0%, 92%, 98%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    .sb-tail { transform-origin: 84px 144px; animation: sb-sway 5s ease-in-out infinite; }
    @keyframes sb-sway { 0%, 50%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
    .sb-wing-0 { transform-origin: 57px 112px; animation: sb-wing-0 10s ease-in-out infinite; }
    @keyframes sb-wing-0 { 0%, 70%, 88%, 100% { transform: rotate(0deg); } 73%, 79%, 85% { transform: rotate(30deg); } 76%, 82% { transform: rotate(7.5deg); } }
    .sb-wing-1 { transform-origin: 111px 112px; animation: sb-wing-1 10s ease-in-out infinite; }
    @keyframes sb-wing-1 { 0%, 70%, 88%, 100% { transform: rotate(0deg); } 73%, 79%, 85% { transform: rotate(-30deg); } 76%, 82% { transform: rotate(-7.5deg); } }
    .sb-beak-lower { animation: sb-beak 10s linear infinite; }
    @keyframes sb-beak { 0%, 70%, 88%, 100% { transform: translateY(0px); } 73%, 79%, 85% { transform: translateY(2.5px); } 76%, 82% { transform: translateY(0.6px); } }
    .sb-say-0 { animation: sb-say-0 10s ease-out 0s infinite; }
    @keyframes sb-say-0 { 0%, 71%, 90%, 100% { opacity: 0; transform: translate(3.94px, 0.69px); } 76% { opacity: 1; } 84% { opacity: 1; } 89% { opacity: 0; transform: translate(-7.88px, -1.39px); } }
    .sb-say-1 { animation: sb-say-1 10s ease-out 0.22s infinite; }
    @keyframes sb-say-1 { 0%, 71%, 90%, 100% { opacity: 0; transform: translate(3.53px, 1.88px); } 76% { opacity: 1; } 84% { opacity: 1; } 89% { opacity: 0; transform: translate(-7.06px, -3.76px); } }
    .sb-say-2 { animation: sb-say-2 10s ease-out 0.44s infinite; }
    @keyframes sb-say-2 { 0%, 71%, 90%, 100% { opacity: 0; transform: translate(2.78px, 2.88px); } 76% { opacity: 1; } 84% { opacity: 1; } 89% { opacity: 0; transform: translate(-5.56px, -5.75px); } }
    @media (prefers-reduced-motion: reduce) { .sb-hop, .sb-head, .sb-tuft, .sb-eye, .sb-tail, .sb-wing, .sb-beak-lower, .sb-say { animation: none; } }
  </style>
